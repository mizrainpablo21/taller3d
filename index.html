<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#F3F4F7">
<meta name="color-scheme" content="light">
<title>Taller 3D Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* Layout idea: one-hand phone app. Large title, sticky price bar, bottom tabs. Memorable element: the cost "layers" block that stacks like printed layers. */
:root{
  /* Paleta del logo: verde de fondo, amarillo del mono, trazo negro */
  --bg:#029551;--surface:#FFFBEA;--surface2:#FFF1B8;--ink:#141414;--ink2:#4B4630;--line:#E3D79A;--bd:#141414;
  --brand:#141414;--brand-ink:#FFD13C;--accent:#FFD13C;
  --ok:#0E7A3E;--warn:#9A5B00;--bad:#C8321F;
  --c1:#FFD13C;--c2:#029551;--c3:#141414;--c4:#FF9F1C;--c5:#9BE564;
  --g-violet:#FFD13C;--g-hot:#FF9F1C;--g-green:#0E7A3E;--g-blue:#5ED6C2;
  --tc:#FFD13C;
  --font-d:'Fredoka','Avenir Next','Trebuchet MS',Arial,sans-serif;
  --font-b:'Nunito','Avenir Next','Helvetica Neue',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overscroll-behavior:none;-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--font-b);font-variant-numeric:tabular-nums}
body.lock{overflow:hidden}
#app{height:100%;height:100dvh;display:flex;flex-direction:column}
main{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 28px}
h1,h2,h3,p{margin:0}
h1{font:800 30px/1.05 var(--font-d);letter-spacing:-.02em;text-wrap:balance}
h2{font:700 17px/1.2 var(--font-d);letter-spacing:-.01em}
h3{font:700 15px/1.2 var(--font-b)}
.muted{color:var(--ink2)}
.small{font-size:13px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:18px}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.head{display:flex;flex-direction:column;gap:4px;margin-bottom:14px}
.back{align-self:flex-start;min-height:40px;margin-left:-8px;padding:0 8px;background:none;border:0;color:var(--brand);font:600 16px var(--font-b);display:inline-flex;align-items:center;gap:4px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
button.card{width:100%;text-align:left;font:inherit;color:inherit}
.card.flat{background:var(--surface2);border-color:transparent}
.card h2{margin-bottom:2px}
.hint{font-size:13px;color:var(--ink2)}
/* form */
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
label,.lbl{font-size:13px;font-weight:600;color:var(--ink2)}
input,select,textarea{width:100%;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--surface2);color:var(--ink);padding:0 12px;font:400 16px var(--font-b);appearance:none;-webkit-appearance:none}
textarea{padding:10px 12px;min-height:84px;resize:vertical;line-height:1.35}
select{background-image:linear-gradient(45deg,transparent 50%,var(--ink2) 50%),linear-gradient(135deg,var(--ink2) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px,6px 6px;background-repeat:no-repeat;padding-right:34px}
input[type=checkbox]{width:24px;min-height:24px;height:24px;flex:none;appearance:auto;-webkit-appearance:checkbox;accent-color:var(--brand)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
.check{display:flex;align-items:center;gap:10px;min-height:44px;font-size:16px;font-weight:500;color:var(--ink)}
details{border-top:1px solid var(--line);padding-top:10px}
summary{min-height:44px;display:flex;align-items:center;justify-content:space-between;font-weight:700;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary::after{content:'+';font-size:22px;color:var(--ink2)}
details[open] summary::after{content:'–'}
/* buttons */
button{font-family:inherit}
.btn{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 16px var(--font-b);padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none;touch-action:manipulation;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;transition:transform .12s ease-out,background .12s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:transparent}
.btn.dark{background:var(--ink);color:var(--bg);border-color:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:40px;font-size:15px;padding:0 12px;border-radius:12px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,.card:focus-visible,summary:focus-visible,.back:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
@media (hover:hover) and (pointer:fine){.btn:hover{background:var(--surface2)}.btn.primary:hover{background:var(--brand);filter:brightness(1.08)}.card[data-act]:hover{border-color:var(--ink2)}}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 10px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font:600 14px var(--font-b);touch-action:manipulation;user-select:none;-webkit-user-select:none}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:transparent}
.chips.inline{margin:0;padding:0;flex-wrap:wrap;overflow:visible}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
/* tiles */
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.tile b{font:800 26px/1.1 var(--font-d);letter-spacing:-.02em}
.tile span{font-size:13px;color:var(--ink2)}
/* quote */
.qbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + 2px);z-index:5;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px}
.qbar small{display:block;font-size:12px;opacity:.75;font-weight:600}
.qbar b{font:800 30px/1.05 var(--font-d);letter-spacing:-.02em}
.qbar .u{text-align:right;font-weight:600;font-size:15px}
.layers{display:flex;gap:16px;align-items:stretch}
.stack3d{width:88px;flex:none;height:168px;display:flex;flex-direction:column-reverse;border-radius:12px;overflow:hidden;position:relative;background:var(--surface2)}
.stack3d i{display:block;min-height:3px}
.stack3d::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(to top,transparent 0 5px,rgba(0,0,0,.2) 5px 6px);pointer-events:none}
.legend{list-style:none;margin:0;padding:0;flex:1;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.legend li{display:flex;align-items:center;gap:8px;font-size:15px}
.legend li i{width:12px;height:12px;border-radius:3px;flex:none}
.legend li span{flex:1}
.legend li b{font-weight:700}
.kv{display:grid;grid-template-columns:1fr auto;gap:8px 12px;margin:0}
.kv dt{color:var(--ink2)}.kv dd{margin:0;font-weight:700;text-align:right}
.warnbox{background:var(--surface2);border-left:4px solid var(--warn);border-radius:8px;padding:10px 12px;font-size:14px}
/* orders */
.order{display:flex;flex-direction:column;gap:6px}
.oid{font:700 13px var(--font-b);color:var(--ink2)}
.otitle{font:700 17px/1.2 var(--font-d)}
.pill{display:inline-flex;align-items:center;gap:6px;min-height:26px;padding:0 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:12px;font-weight:700;white-space:nowrap}
.pill::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--stc,var(--c4))}
.seg{display:flex;gap:3px;margin:2px 0}
.seg i{flex:1;height:5px;border-radius:3px;background:var(--line)}
.seg i.on{background:var(--c1)}
.empty{text-align:center;padding:28px 12px;display:flex;flex-direction:column;gap:10px;align-items:center}
.empty p{max-width:34ch;color:var(--ink2)}
.list{display:flex;flex-direction:column;gap:10px}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c2)}
.bar.low i{background:var(--bad)}
.line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.line:first-child{border-top:0}
canvas.label{width:100%;height:auto;border:1px solid var(--line);border-radius:10px;background:#fff;display:block}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50;visibility:hidden;transition:visibility 0s linear .3s}
.sheet.open{visibility:visible;transition-delay:0s}
.sheet-bg{position:absolute;inset:0;background:rgba(8,14,20,.55);opacity:0;transition:opacity .25s}
.sheet.open .sheet-bg{opacity:1}
.sheet-panel{position:absolute;left:0;right:0;bottom:0;max-height:94%;display:flex;flex-direction:column;background:var(--bg);border-radius:22px 22px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.32,.72,0,1)}
.sheet.open .sheet-panel{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 2px;flex:none}
#sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:6px 16px calc(28px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}

/* ===== color, movimiento y billetera ===== */
#app{background:radial-gradient(420px 320px at 100% -4%,var(--glow1),transparent 70%),radial-gradient(380px 300px at -6% 100%,var(--glow2),transparent 70%),var(--bg)}
nav{display:flex;gap:4px;margin:0 12px calc(8px + env(safe-area-inset-bottom,0px));padding:6px;background:var(--surface);border:1px solid var(--line);border-radius:28px;box-shadow:0 12px 30px -10px rgba(40,20,120,.32)}
.tab{flex:1 1 0;min-width:0;height:48px;border:0;border-radius:22px;background:transparent;color:var(--ink2);display:flex;align-items:center;justify-content:center;gap:6px;overflow:hidden;font-family:var(--font-b);touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:flex-grow .45s cubic-bezier(.3,1.3,.5,1),background-color .25s,color .25s,transform .2s}
.tab svg{width:22px;height:22px;flex:none}
.tab span{max-width:0;opacity:0;overflow:hidden;white-space:nowrap;font-weight:700;font-size:13px;transition:max-width .45s cubic-bezier(.3,1.3,.5,1),opacity .25s}
.tab[aria-current="page"]{flex-grow:2.7;background:var(--tc);color:#fff;box-shadow:0 8px 18px -8px var(--tc)}
.tab[aria-current="page"] span{max-width:92px;opacity:1}
.tab[aria-current="page"] svg{animation:tabPop .5s cubic-bezier(.3,1.6,.5,1)}
.tab:active{transform:scale(.92)}
@keyframes tabPop{0%{transform:scale(.55) rotate(-14deg)}60%{transform:scale(1.25) rotate(6deg)}100%{transform:none}}
.head .ttl{display:flex;align-items:center;gap:12px}
.bub{width:42px;height:42px;border-radius:14px;background:var(--tc);color:#fff;display:grid;place-items:center;flex:none;transform:rotate(-6deg);box-shadow:0 8px 16px -8px var(--tc)}
.bub svg{width:22px;height:22px}
.bub.sm{width:38px;height:38px;border-radius:12px;transform:none}
main.enter .head .bub{animation:bubIn .65s cubic-bezier(.2,1.5,.4,1) both .05s}
@keyframes bubIn{from{transform:rotate(-40deg) scale(.3);opacity:0}to{transform:rotate(-6deg) scale(1);opacity:1}}
.card>h2::before{content:'';display:inline-block;width:6px;height:15px;border-radius:3px;background:var(--tc);margin-right:8px;vertical-align:-2px}
/* banner de impresion */
.banner{position:relative;display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:150px;padding:18px 14px 18px 20px;margin-bottom:16px;border-radius:26px;color:#fff;overflow:hidden;background:linear-gradient(140deg,#1A1840 0%,#3B1D8F 62%,#6D3CF0 100%);box-shadow:0 18px 34px -18px rgba(70,30,190,.8)}
.banner::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.07) 0 2px,transparent 2px 7px);pointer-events:none}
.banner .bt{position:relative;display:flex;flex-direction:column;gap:6px;min-width:0}
.banner small{font-weight:600;opacity:.85;font-size:14px}
.banner h1{color:#fff;font-size:28px}
.banner p{font-size:14px;opacity:.92}
.pb{width:128px;height:auto;flex:none;position:relative}
main.enter .pb .ly{transform-box:fill-box;transform-origin:center;animation:lyIn .42s cubic-bezier(.2,1.4,.4,1) both}
main.enter .pb .nzy{animation:nzy 2.52s steps(9,end) .3s both}
main.enter .pb .nzx{animation:nzx 1.2s ease-in-out .3s 2 both}
@keyframes lyIn{from{transform:scaleX(.15);opacity:0}to{transform:none;opacity:1}}
@keyframes nzy{from{transform:translateY(0)}to{transform:translateY(-64px)}}
@keyframes nzx{0%{transform:translateX(0)}25%{transform:translateX(-24px)}75%{transform:translateX(24px)}100%{transform:translateX(0)}}
/* tiles de color */
.tile{position:relative;overflow:hidden;border:0;color:#fff;gap:4px;padding:14px}
.tile::after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.09) 0 2px,transparent 2px 7px);pointer-events:none}
.tile b,.tile span{position:relative;z-index:1}
.tile span{color:rgba(255,255,255,.94);font-weight:600}
.t-violet{background:var(--g-violet)}.t-hot{background:var(--g-hot)}.t-green{background:var(--g-green)}.t-blue{background:var(--g-blue)}
/* botones */
.btn{transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .15s,filter .15s}
.btn:active{transform:scale(.95);transition-duration:.08s}
.btn.primary{background:var(--g-violet);color:#fff}
.btn.hot{background:var(--g-hot);color:#fff;border-color:transparent}
.btn.green{background:var(--g-green);color:#fff;border-color:transparent}
.btn.teal{background:var(--g-blue);color:#fff;border-color:transparent}
.btn.primary,.btn.hot,.btn.green,.btn.teal{box-shadow:0 8px 18px -8px rgba(60,30,160,.55)}
@media (hover:hover) and (pointer:fine){.btn.primary:hover{background:var(--g-violet)}.btn.hot:hover{background:var(--g-hot);filter:brightness(1.08)}.btn.green:hover{background:var(--g-green);filter:brightness(1.08)}.btn.teal:hover{background:var(--g-blue);filter:brightness(1.08)}}
.chip{transition:transform .25s cubic-bezier(.3,1.6,.5,1),background .2s,color .2s}
.chip:active{transform:scale(.93)}
.chip[aria-pressed="true"]{background:var(--tc);color:#fff;border-color:transparent}
.qbar{background:linear-gradient(120deg,#1A1840,#4A2BC4 58%,#D6246E);color:#fff;box-shadow:0 12px 24px -12px rgba(74,43,196,.75)}
.qbar small{opacity:.88}
.stack3d i{min-height:0;transition:flex-grow .55s cubic-bezier(.3,1.3,.5,1)}
/* pedidos */
.order{border-left:6px solid var(--stc,var(--line))}
.seg i.on{background:var(--stc,var(--c1))}
.pill.live::before{animation:pulse 1.4s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--stc)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}
button.card{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
button.card:active{transform:scale(.98)}
/* entrada de pantallas */
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.8) translateY(10px)}to{opacity:1;transform:none}}
@keyframes segIn{from{transform:scaleX(0)}to{transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:none}}
main.enter .head,main.enter>.banner,main.enter>.stack-lg>*,main.enter>.stack>*,main.enter>.list>*{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
main.enter .tiles>*{animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}
main.enter .seg i{transform-origin:left;animation:segIn .55s cubic-bezier(.2,.8,.2,1) both}
#plist.anim>*{animation:rise .38s cubic-bezier(.2,.8,.2,1) both}
main.enter>.stack-lg>*:nth-child(1),main.enter>.stack>*:nth-child(1),main.enter>.list>*:nth-child(1){animation-delay:0.11s}
main.enter>.stack-lg>*:nth-child(2),main.enter>.stack>*:nth-child(2),main.enter>.list>*:nth-child(2){animation-delay:0.16s}
main.enter>.stack-lg>*:nth-child(3),main.enter>.stack>*:nth-child(3),main.enter>.list>*:nth-child(3){animation-delay:0.21s}
main.enter>.stack-lg>*:nth-child(4),main.enter>.stack>*:nth-child(4),main.enter>.list>*:nth-child(4){animation-delay:0.26s}
main.enter>.stack-lg>*:nth-child(5),main.enter>.stack>*:nth-child(5),main.enter>.list>*:nth-child(5){animation-delay:0.31s}
main.enter>.stack-lg>*:nth-child(6),main.enter>.stack>*:nth-child(6),main.enter>.list>*:nth-child(6){animation-delay:0.36s}
main.enter>.stack-lg>*:nth-child(7),main.enter>.stack>*:nth-child(7),main.enter>.list>*:nth-child(7){animation-delay:0.41s}
main.enter>.stack-lg>*:nth-child(8),main.enter>.stack>*:nth-child(8),main.enter>.list>*:nth-child(8){animation-delay:0.46s}
main.enter>.stack-lg>*:nth-child(9),main.enter>.stack>*:nth-child(9),main.enter>.list>*:nth-child(9){animation-delay:0.51s}
#plist.anim>*:nth-child(1){animation-delay:0.03s}
#plist.anim>*:nth-child(2){animation-delay:0.06s}
#plist.anim>*:nth-child(3){animation-delay:0.09s}
#plist.anim>*:nth-child(4){animation-delay:0.12s}
#plist.anim>*:nth-child(5){animation-delay:0.15s}
#plist.anim>*:nth-child(6){animation-delay:0.18s}
#plist.anim>*:nth-child(7){animation-delay:0.21s}
#plist.anim>*:nth-child(8){animation-delay:0.24s}
main.enter .tiles>*:nth-child(1){animation-delay:0.19s}
main.enter .tiles>*:nth-child(2){animation-delay:0.26s}
main.enter .tiles>*:nth-child(3){animation-delay:0.33s}
main.enter .tiles>*:nth-child(4){animation-delay:0.4s}
main.enter .seg i:nth-child(1){animation-delay:0.31s}
main.enter .seg i:nth-child(2){animation-delay:0.37s}
main.enter .seg i:nth-child(3){animation-delay:0.43s}
main.enter .seg i:nth-child(4){animation-delay:0.49s}
main.enter .seg i:nth-child(5){animation-delay:0.55s}
main.enter .seg i:nth-child(6){animation-delay:0.61s}
main.enter .seg i:nth-child(7){animation-delay:0.67s}

/* billetera */
.wal{position:relative;overflow:hidden;border-radius:26px;padding:18px;color:#fff;background:linear-gradient(135deg,#15985A,#0A8F86 55%,#2563EB);display:flex;flex-direction:column;gap:6px;box-shadow:0 18px 34px -18px rgba(10,143,134,.8)}
.wal::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 2px,transparent 2px 7px);pointer-events:none}
.wal>*{position:relative}
.wal small{font-weight:600;opacity:.92;font-size:14px}
.wal .bal{font:800 40px/1.05 var(--font-d);letter-spacing:-.02em}
.wal .wrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.wal .wrow div{background:rgba(255,255,255,.17);border-radius:14px;padding:8px 10px;display:flex;flex-direction:column;min-width:0}
.wal .wrow span{font-size:12px;opacity:.92}
.wal .wrow b{font-size:15px;white-space:nowrap}
.mstep{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mstep b{font:700 17px var(--font-d);text-transform:capitalize}
.mchart{display:flex;gap:6px;align-items:flex-end;border-bottom:1px solid var(--line)}

};
function tween(el,to,fmt,dur,from){
  if(!el)return;
  var f=from!=null?from:(el.__v||0);el.__v=to;
  cancelAnimationFrame(el.__r);
  if(reduce||f===to){el.textContent=fmt(to,true);return}
  var t0=null;
  function step(t){
    if(t0===null)t0=t;
    var k=Math.min(1,(t-t0)/(dur||700)),e=1-Math.pow(1-k,3);
    if(k<1){el.textContent=fmt(f+(to-f)*e,false);el.__r=requestAnimationFrame(step)}else el.textContent=fmt(to,true);
  }
  el.__r=requestAnimationFrame(step);
}
function animateCounts(onlyFrom){
  document.querySelectorAll('[data-count]').forEach(function(el){
    var hasFrom=el.dataset.from!==undefined;
    if(onlyFrom&&!hasFrom)return;
    el.__v=hasFrom?+el.dataset.from:0;
    tween(el,+el.dataset.count,FMT[el.dataset.fmt]||FMT.int,750);
  });
}
function burst(el,n){
  if(reduce||!el||!el.getBoundingClientRect)return;
  var r=el.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2;
  var cols=['#FFD13C','#141414','#FFFFFF','#FF9F1C','#9BE564','#E5483A'];
  for(var i=0;i<(n||22);i++){
    var q=document.createElement('i');q.className='cf';
    var a=Math.random()*Math.PI*2,d=60+Math.random()*110;
    q.style.cssText='left:'+cx+'px;top:'+cy+'px;background:'+cols[i%cols.length]+';--dx:'+(Math.cos(a)*d).toFixed(0)+'px;--dy:'+(Math.sin(a)*d-50).toFixed(0)+'px;--rot:'+(Math.random()*600-300).toFixed(0)+'deg';
    document.body.appendChild(q);
    (function(n){setTimeout(function(){n.remove()},950)})(q);
  }
}

    if(data&&data.json&&exists!==false){

        try{S=merge(JSON.parse(data.json));S.updatedAt=data.updatedAt;persistLocal();if(!ui.sheet)render(true)}catch(e){}
      }else pushCloud();

  }).catch(function(){cloud.state='err'});

/* ---------- cálculo de cotización ---------- */
function calc(d,s){
  var mat=s.materiales.filter(function(m){return m.id===d.material})[0]||s.materiales[0]||{nombre:'—',costoKg:0};
  var qty=Math.max(1,Math.round(num(d.cantidad))||1);
  var hrs=num(d.horas)+num(d.minutos)/60;
  var g=num(d.gramos);
  var uMat=g*(1+s.desperdicioPct/100)/1000*mat.costoKg;
  var uEnergia=hrs*s.watts/1000*s.kwh;
  var uMaq=hrs*s.maquinaQh;
  var uPost=num(d.postMin)/60*s.manoObraH;
  var uBase=uMat+uEnergia+uMaq+uPost+s.consumibles;
  var uFalla=uBase*s.fallaPct/100;
  var setup=num(d.setupMin)/60*s.manoObraH;
  var diseno=num(d.disenoH)*s.disenoH;
  var cMat=uMat*qty,cMaq=(uEnergia+uMaq)*qty,cMano=uPost*qty+setup+diseno,cOtros=(s.consumibles+uFalla)*qty;
  var costo=cMat+cMaq+cMano+cOtros;
  var margen=(d.margen===''||d.margen==null)?s.margenPct:num(d.margen);
  var precio=costo*(1+margen/100);
  precio*=(1+num(d.urgPct)/100);
  precio*=(1-Math.min(100,num(d.descPct))/100);
  if(costo>0)precio=Math.max(precio,s.minimo);
  precio=Math.ceil(precio-1e-9);
  var envio=num(d.envio);
  var sub=precio+envio;
  var iva=s.iva?sub*0.12:0;
  var total=sub+iva;
  var ganancia=precio-costo;
  var horasTotal=hrs*qty;
  var dias=Math.max(2,Math.ceil(horasTotal/16)+2);
  return {mat:mat,qty:qty,hrs:hrs,horasTotal:horasTotal,g:g,cMat:cMat,cMaq:cMaq,cMano:cMano,cOtros:cOtros,costo:costo,margen:margen,
    precio:precio,envio:envio,iva:iva,total:total,ganancia:ganancia,
    margenReal:precio>0?ganancia/precio:0,unit:precio/qty,dias:dias,valido:g>0&&hrs>0};
}

/* etiqueta en canvas */
function wrap(c,text,x,y,maxW,lh,maxLines){
  var words=String(text||'').split(/\s+/).filter(Boolean),line='',out=[];
  words.forEach(function(w){var t=line?line+' '+w:w;if(c.measureText(t).width>maxW&&line){out.push(line);line=w}else line=t});
  if(line)out.push(line);
  if(out.length>maxLines){out.length=maxLines;out[maxLines-1]=out[maxLines-1].replace(/.{0,2}$/,'…')}
  out.forEach(function(l,i){c.fillText(l,x,y+i*lh)});
  return y+Math.max(out.length,1)*lh;
}
function clip(c,t,w){t=String(t);if(c.measureText(t).width<=w)return t;while(t.length>1&&c.measureText(t+'…').width>w)t=t.slice(0,-1);return t+'…'}
function drawQR(c,text,x,y,size){
  if(typeof qrcode!=='function')return;
  try{var q=qrcode(0,'M');q.addData(text);q.make();var n=q.getModuleCount(),cell=Math.floor(size/n),off=Math.floor((size-cell*n)/2);
    c.fillStyle='#000';for(var r=0;r<n;r++)for(var k=0;k<n;k++)if(q.isDark(r,k))c.fillRect(x+off+k*cell,y+off+r*cell,cell,cell)}catch(e){}
}

  c.font='700 40px '+F;c.fillText(clip(c,s.negocio,480),32,70);

var WIN=['Venta','Anticipo','Reembolso','Otro ingreso'];
var WOUT=['Filamento y material','Repuestos y mantenimiento','Luz y renta','Envíos','Herramientas','Publicidad','Retiro personal','Otro retiro'];
var MESES=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
function WCATS(t){return t==='ingreso'?WIN:WOUT}
function wBalance(){return S.wallet.reduce(function(a,t){return a+(t.tipo==='ingreso'?1:-1)*num(t.monto)},0)}
function addWallet(t){S.wallet.push(Object.assign({id:uid(),creado:Date.now(),fecha:todayStr(),nota:''},t))}
function mKey(f){return String(f).slice(0,7)}
function shiftMonth(k,d){var p=k.split('-').map(Number),dt=new Date(p[0],p[1]-1+d,1);return dt.getFullYear()+'-'+pad(dt.getMonth()+1,2)}
function mLabel(k){var p=k.split('-');return MESES[+p[1]-1]+' '+p[0]}
function sumW(l,tipo){return l.filter(function(t){return t.tipo===tipo}).reduce(function(a,t){return a+num(t.monto)},0)}
function dayLabel(f){var t=todayStr();if(f===t)return 'Hoy';if(f===addDays(t,-1))return 'Ayer';return parseD(f).toLocaleDateString('es-GT',{weekday:'short',day:'numeric',month:'short'})}
function registrarPago(o,monto,nota,btn){
  var before=o.total-pagado(o),pg={id:uid(),fecha:todayStr(),monto:monto,nota:nota};
  o.pagos.push(pg);
  addWallet({tipo:'ingreso',monto:monto,concepto:'Pago '+o.id+' · '+o.cliente,categoria:nota==='Anticipo'?'Anticipo':'Venta',orderId:o.id,pagoId:pg.id,auto:true,fecha:pg.fecha});
  var done=before>0.009&&o.total-pagado(o)<=0.009;
  if(done)celebrate('¡Pedido pagado completo!',btn,'love');
  save();refreshOrder();if(!done)toast('Pago registrado en tu billetera');
}
function txRow(t){
  var isIn=t.tipo==='ingreso';
  return '<button class="trow" data-act="w-open" data-id="'+t.id+'"><span class="tic '+(isIn?'in':'out')+'">'+(isIn?ICON.down:ICON.up)+'</span><span class="grow"><b>'+esc(t.concepto||t.categoria)+'</b><br><span class="muted small">'+esc(t.categoria)+(t.auto?' · Automático':'')+(t.nota?' · '+esc(t.nota):'')+'</span></span><span class="amt '+(isIn?'in':'out')+'">'+(isIn?'+':'−')+money(t.monto)+'</span></button>';
}

  var k=ui.wm,cur=todayStr().slice(0,7),bal=wBalance();
  var inM=S.wallet.filter(function(t){return mKey(t.fecha)===k});
  var mi=sumW(inM,'ingreso'),mo=sumW(inM,'retiro');
  var months=[];for(var i=5;i>=0;i--)months.push(shiftMonth(cur,-i));
  var data=months.map(function(m){var l=S.wallet.filter(function(t){return mKey(t.fecha)===m});return {m:m,i:sumW(l,'ingreso'),o:sumW(l,'retiro')}});
  var max=Math.max.apply(null,[1].concat(data.map(function(d){return Math.max(d.i,d.o)})));
  var chart=data.map(function(d,idx){
    var hi=d.i>0?Math.max(4,d.i/max*100):0,ho=d.o>0?Math.max(4,d.o/max*100):0;
    return '<button class="mcol'+(d.m===k?' sel':'')+'" data-act="w-setm" data-m="'+d.m+'" aria-label="'+mLabel(d.m)+': ingresos '+money(d.i)+', retiros '+money(d.o)+'"><span class="bars"><i class="bi" style="height:'+hi.toFixed(0)+'px;animation-delay:'+(idx*0.06).toFixed(2)+'s"></i><i class="bo" style="height:'+ho.toFixed(0)+'px;animation-delay:'+(idx*0.06+0.03).toFixed(2)+'s"></i></span><span class="ml">'+MESES[+d.m.split('-')[1]-1]+'</span></button>';
  }).join('');
  var list=inM.filter(function(t){return ui.wf==='todo'||t.tipo===ui.wf}).sort(function(a,b){return b.fecha.localeCompare(a.fecha)||b.creado-a.creado});
  var rows='',last='',open=false;
  list.forEach(function(t){
    if(t.fecha!==last){if(open)rows+='</div>';rows+='<div class="card tgroup"><div class="tday">'+dayLabel(t.fecha)+'</div>';last=t.fecha;open=true}
    rows+=txRow(t);
  });
  if(open)rows+='</div>';
  var from=walletLast==null?0:walletLast;walletLast=bal;
  var chips=[['todo','Todo'],['ingreso','Ingresos'],['retiro','Retiros']].map(function(f){return '<button class="chip" data-act="w-filter" data-f="'+f[0]+'" aria-pressed="'+(ui.wf===f[0])+'">'+f[1]+'</button>'}).join('');
  return head('Billetera','Lo que entra y lo que sale de tu taller.')+
  '<div class="stack-lg">'+
  '<div class="walw"><span class="peek" aria-hidden="true"></span><div class="wal"><small>Saldo disponible</small><b class="bal" data-count="'+bal+'" data-from="'+from+'" data-fmt="money">'+money(bal)+'</b>'+
    '<div class="wrow"><div><span>Ingresos</span><b>+'+money(mi)+'</b></div><div><span>Retiros</span><b>−'+money(mo)+'</b></div><div><span>Neto</span><b>'+(mi-mo<0?'−':'')+money(Math.abs(mi-mo))+'</b></div></div><small style="opacity:.8">Cifras de '+mLabel(k)+'</small></div></div>'+

  '<section class="card stack"><h2>Últimos 6 meses</h2><div class="mchart">'+chart+'</div><div class="legend2"><span><i style="background:var(--g-green)"></i>Ingresos</span><span><i style="background:var(--g-hot)"></i>Retiros</span><span>Escala hasta '+money(max)+'</span></div></section>'+
  '<section class="stack"><div class="mstep"><button class="btn sm" data-act="w-month" data-d="-1" aria-label="Mes anterior">'+ICON.prev+'</button><b>'+mLabel(k)+'</b><button class="btn sm" data-act="w-month" data-d="1" aria-label="Mes siguiente"'+(k>=cur?' disabled':'')+'>'+ICON.next+'</button></div><div class="chips inline">'+chips+'</div>'+
  (rows?'<div class="list">'+rows+'</div>':'<div class="card empty"><div class="eav">'+avf('money')+'</div><p>No hay movimientos en '+mLabel(k)+'. Registra un ingreso o un retiro con los botones de arriba.</p>'+(S.wallet.length?'':'<button class="btn sm" data-act="demo">Cargar ejemplos</button>')+'</div>')+'</section>'+
  '<button class="btn block" id="w-csv" data-act="w-csv"'+(dlCap?'':' hidden')+'>'+ICON.save+'Exportar movimientos (CSV)</button></div>';
}

var toastT;function toast(m,k){if(!k){k=/^(Falta|Escribe|Ponle|Deja|Descarga no)/.test(m)?'worry':/eliminad|borrad/i.test(m)?'sad':/Estado: Entregado|registrado|Pago/.test(m)?'money':/guardad|creado|Ejemplos|restaurad|Copiado/i.test(m)?'happy':'my'}toastEl.innerHTML=(k==='my'?myAv():av(k))+'<span></span>';toastEl.lastChild.textContent=m;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(function(){toastEl.classList.remove('show')},2200)}
function copyText(t,msg){
  function fallback(){ui.sheet={type:'copy'};openSheet('<div class="row between"><h1 style="font-size:24px">Copiar texto</h1><button class="btn sm" data-act="close-sheet">Cerrar</button></div><p class="hint">Mantén presionado el texto, elige Seleccionar todo y copia.</p><textarea id="cp" readonly style="min-height:240px">'+esc(t)+'</textarea>');var a=$('#cp');if(a){a.focus();a.select()}}
  try{navigator.clipboard.writeText(t).then(function(){toast(msg||'Copiado')},fallback)}catch(e){fallback()}
}

  var b=mk({cliente:'Taller Gómez',telefono:'44449876',pieza:'Engranes de repuesto',cantidad:10,material:'PETG',horasTotal:16,total:420,estado:'cola',entrega:addDays(t,4),pagos:[{fecha:t,monto:210,nota:'Anticipo'}]});
  var c=mk({cliente:'Luis Pérez',telefono:'33332211',pieza:'Figura articulada',cantidad:1,material:'PLA',horasTotal:7,total:210,estado:'cotizado'});

/* ---------- eventos ---------- */
var dlCap=null;
document.addEventListener('click',function(e){
  var a=e.target.closest('[data-act]');if(!a||a.tagName==='SELECT')return;
  var act=a.dataset.act;

  var id=a.dataset.id,o;
  switch(act){
    case 'tab':if(ui.sheet)closeSheet();go(a.dataset.tab);break;
    case 'back':go('mas');break;
    case 'more':go('mas',a.dataset.sub);break;
    case 'close-sheet':closeSheet();break;
    case 'chip':S.draft[a.dataset.k]=a.dataset.v;var inp=$('#q-'+a.dataset.k);if(inp)inp.value=a.dataset.v;updateResults();saveSoon();break;
    case 'q-save':saveQuote(a.dataset.estado);break;

    case 'filter':ui.filter=a.dataset.f;renderList(true);break;
    case 'open-order':openOrder(id);break;
    case 'next-estado':o=getOrder(id);if(o){if(a.dataset.next==='entregado'){celebrate('¡Entregado! Buen trabajo',a,'party');setEstado(o,a.dataset.next,true)}else setEstado(o,a.dataset.next)}break;
    case 'add-pago':o=getOrder(id);var m=num($('#o-pago').value);if(o&&m>0)registrarPago(o,m,o.pagos.length?'Abono':'Anticipo',a);else toast('Escribe el monto');break;
    case 'pagar-saldo':o=getOrder(id);if(o)registrarPago(o,Math.round((o.total-pagado(o))*100)/100,'Saldo',a);break;
    case 'del-pago':o=getOrder(id);if(o){var pq=o.pagos.splice(+a.dataset.i,1)[0];if(pq)S.wallet=S.wallet.filter(function(w){return w.pagoId!==pq.id});save();refreshOrder()}break;
    case 'del-order':S.wallet.forEach(function(w){if(w.orderId===id)w.auto=false});S.orders=S.orders.filter(function(x){return x.id!==id});save();closeSheet();render(true);toast('Pedido eliminado');break;
    case 'order-guide':openGuide(null,id);break;
    case 'new-guide':if(ui.tab!=='envios')go('envios');openGuide(null,null);break;
    case 'open-guide':openGuide(id);break;
    case 'save-guide':saveGuide();break;
    case 'copy-guide':if(ui.gd)copyText(guideText(ui.gd),'Datos copiados');break;
    case 'dl-label':
      if(!dlCap){toast('Descarga no disponible');break}
      $('#lbl').toBlob(function(b){if(!b)return;dlCap.save({filename:(ui.gd.id||'etiqueta')+'.png',data:b}).then(function(){toast('Etiqueta guardada')},function(er){if(!er||er.code!=='declined')toast('No se pudo guardar')})});break;
    case 'guide-sent':if(saveGuide()){var g=ui.gd;g.estado='enviada';var gi=S.guides.map(function(x){return x.id}).indexOf(g.id);S.guides[gi].estado='enviada';var oo=g.orderId&&getOrder(g.orderId);if(oo&&FLUJO.indexOf(oo.estado)<FLUJO.indexOf('enviado')&&oo.estado!=='cancelado'){oo.estado='enviado';oo.historial.push({estado:'enviado',t:Date.now()})}save();closeSheet();render(true);toast('Guía marcada como enviada')}break;
    case 'del-guide':S.guides=S.guides.filter(function(x){return x.id!==ui.gd.id});S.orders.forEach(function(x){if(x.guiaId===ui.gd.id)x.guiaId=''});save();closeSheet();render(true);toast('Guía eliminada');break;
    case 'fil-add':
      var mat=$('#n-mat').value,g0=num($('#n-g').value)||1000;
      S.filaments.push({id:uid(),material:mat,color:$('#n-col').value.trim(),marca:$('#n-mar').value.trim(),inicial:g0,restante:g0,costo:num($('#n-c').value)});save();render(true);toast('Rollo agregado');break;
    case 'fil-use':var f=S.filaments.filter(function(x){return x.id===id})[0],u=num($('#u-'+id).value);if(f&&u>0){f.restante=Math.max(0,f.restante-u);save();render(true)}else toast('Escribe los gramos usados');break;
    case 'fil-new':var f2=S.filaments.filter(function(x){return x.id===id})[0];if(f2){f2.restante=f2.inicial;save();render(true)}break;
    case 'fil-del':S.filaments=S.filaments.filter(function(x){return x.id!==id});save();render(true);break;
    case 'mat-add':S.settings.materiales.push({id:uid(),nombre:'Nuevo material',costoKg:200});save();render(true);break;
    case 'mat-del':if(S.settings.materiales.length>1){S.settings.materiales.splice(+a.dataset.i,1);save();render(true)}else toast('Deja al menos un material');break;
    case 'backup-copy':copyText(JSON.stringify(S),'Respaldo copiado');break;
    case 'backup-dl':
      if(!dlCap){toast('Descarga no disponible, usa Copiar respaldo');break}
      dlCap.save({filename:'respaldo-taller3d-'+todayStr()+'.json',data:new Blob([JSON.stringify(S)],{type:'application/json'})}).then(function(){toast('Respaldo guardado')},function(er){if(!er||er.code!=='declined')toast('No se pudo guardar')});break;
    case 'backup-restore':try{var obj=JSON.parse($('#bk-in').value);if(!obj||!obj.settings)throw 0;S=merge(obj);save();render(false);toast('Datos restaurados')}catch(x){toast('El respaldo no es válido')}break;
    case 'set-av':S.settings.avatar=a.dataset.av;save();document.querySelectorAll('.avb').forEach(function(b){b.setAttribute('aria-pressed',String(b.dataset.av===S.settings.avatar))});var ab=$('#av-big');if(ab){ab.innerHTML=myAvf();ab.classList.remove('pop');}var an=$('#av-name');if(an)an.textContent=AVL[S.settings.avatar];buildNav();render(true);setFavicon();window.scrollTo(0,0);break;
    case 'av-dl':if(!dlCap){toast('Descarga no disponible');break}
      (function(){var k=myKey();var c=document.createElement('canvas');c.width=c.height=800;var x=c.getContext('2d');var im=new Image();
        im.onload=function(){x.fillStyle='#029551';x.fillRect(0,0,800,800);x.fillStyle='#FFF1B8';x.beginPath();x.arc(400,400,370,0,7);x.fill();x.lineWidth=14;x.strokeStyle='#141414';x.stroke();x.save();x.beginPath();x.arc(400,400,356,0,7);x.clip();x.imageSmoothingQuality='high';x.drawImage(im,70,70,660,660);x.restore();
          c.toBlob(function(b){if(!b)return;dlCap.save({filename:'avatar-mono-'+k+'.png',data:b}).then(function(){toast('Avatar guardado','happy')},function(er){if(!er||er.code!=='cancelled')toast('No se pudo guardar','worry')})},'image/png')};
        im.src=AVD[AVKEY[k]].h})();break;
    case 'mono':
      ui.mi=(ui.mi+1)%ui.msgs.length;var hb=$('#hero-b');
      var md=$('#mood');if(md){md.innerHTML=av(ui.moods[ui.mi]);md.classList.remove('pop');void md.offsetWidth;md.classList.add('pop')}
      if(hb){hb.textContent=ui.msgs[ui.mi];hb.classList.remove('pop');void hb.offsetWidth;hb.classList.add('pop')}
      a.classList.remove('wig');void a.offsetWidth;a.classList.add('wig');setTimeout(function(){a.classList.remove('wig')},700);burst(a,12);break;
    case 'w-new':openTx(null,a.dataset.tipo);break;
    case 'w-open':openTx(id);break;
    case 'w-tipo':ui.td.tipo=a.dataset.tipo;if(WCATS(ui.td.tipo).indexOf(ui.td.categoria)<0)ui.td.categoria=WCATS(ui.td.tipo)[0];refreshTx();break;
    case 'w-save':saveTx(a);break;
    case 'w-del':S.wallet=S.wallet.filter(function(x){return x.id!==ui.td.id});save();closeSheet();render(true);toast('Movimiento eliminado');break;
    case 'w-month':ui.wm=shiftMonth(ui.wm,+a.dataset.d);render(true);break;
    case 'w-setm':ui.wm=a.dataset.m;render(true);break;
    case 'w-filter':ui.wf=a.dataset.f;render(true);break;
    case 'w-order':closeSheet();go('pedidos');openOrder(a.dataset.o);break;
    case 'w-csv':
      if(!dlCap){toast('Descarga no disponible');break}
      dlCap.save({filename:'billetera-'+todayStr()+'.csv',data:new Blob([walletCSV()],{type:'text/csv'})}).then(function(){toast('Archivo guardado')},function(er){if(!er||er.code!=='declined')toast('No se pudo guardar')});break;
    case 'demo':loadDemo();break;
    case 'del-demo':S.wallet=S.wallet.filter(function(x){return !x.demo});S.orders=S.orders.filter(function(x){return !x.demo});S.filaments=S.filaments.filter(function(x){return !x.demo});save();render(true);toast('Ejemplos quitados');break;
    case 'wipe':S=merge({});S.draft=newDraft(false);save();render(false);toast('Datos borrados');break;
  }
});
function onInput(e){
  var t=e.target,d=t.dataset;if(!d)return;
  if(d.k!==undefined){if(e.type!=='input')return;S.draft[d.k]=t.value;updateResults();saveSoon()}
  else if(d.g!==undefined)onGuideInput(t,e.type);
  else if(d.s!==undefined){setSetting(t)}
  else if(d.mat!==undefined){var m=S.settings.materiales[+d.i];if(m){if(d.mat==='n')m.nombre=t.value;else m.costoKg=num(t.value);saveSoon()}}
  else if(d.f!==undefined&&e.type==='change'){var o=getOrder(d.id);if(o){o[d.f]=t.value;save();if(ui.tab==='pedidos')renderList()}}
  else if(d.act==='set-estado'&&e.type==='change'){var o2=getOrder(d.id);if(o2)setEstado(o2,t.value)}
  else if(d.w!==undefined){if(ui.td)ui.td[d.w]=t.value}
  else if(t.id==='oq'){ui.q=t.value;renderList()}
  else if(d.vol!==undefined){calcVol()}
}
document.addEventListener('input',onInput);
document.addEventListener('change',onInput);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&ui.sheet)closeSheet()});
